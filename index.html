<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>Emad Elshafey</title>
<style>
  body { background: black; color: white; font-family: sans-serif; text-align: center; }
  nav { background: #111; padding: 15px; }
  nav button { background: none; border: none; color: white; margin: 0 15px; font-size: 18px; cursor: pointer; }
  nav button:hover { color: red; }
  .page { display: none; padding: 30px; }
  .page.active { display: block; }
</style>
</head>
<body>

<nav>
  <button onclick="showPage('home')">الرئيسية</button>
  <button onclick="showPage('about')">عني</button>
  <button onclick="showPage('tools')">أدواتي</button>
  <button onclick="showPage('contact')">تواصل</button>
</nav>

<div id="home" class="page active">
  <h1>أهلا بيك في موقعي 🔥</h1>
  <p>انا عماد الشافعي - Red Teamer</p>
</div>

<div id="about" class="page">
  <h1>عني</h1>
  <p>بحب السايبر سيكيورتي والاختراق الأخلاقي</p>
</div>

<div id="tools" class="page">
  <h1>أدواتي</h1>
  <p>هنا هحط الأدوات اللي بستخدمها</p>
</div>

<div id="contact" class="page">
  <h1>تواصل معايا</h1>
  <p>واتساب / فيسبوك / انستجرام</p>
</div>

<script>
function showPage(id) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}
</script>

</body>
</html>
